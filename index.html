<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Glassmorphism Dashboard</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="bg1"></div>
  <div class="bg2"></div>

  <div class="dashboard">

    <div class="sidebar">

      <div class="logo">Dashboard</div>

      <ul class="menu">
        <li><a href="index.html">Home</a></li>
        <li><a href="analytics.html">Analytics</a></li>
        <li><a href="projects.html">Projects</a></li>
        <li><a href="profile.html">Profile</a></li>
        <li><a href="settings.html">Settings</a></li>
      </ul>

    </div>

    <div class="main">

      <div class="topbar">
        <h1>Welcome Back 👋</h1>
        <div class="profile">S</div>
      </div>

      <div class="cards">

        <div class="card">
          <h2>24</h2>
          <p>Total Projects</p>
        </div>

        <div class="card">
          <h2>12K</h2>
          <p>Profile Views</p>
        </div>

        <div class="card">
          <h2>8</h2>
          <p>Certificates</p>
        </div>

        <div class="card">
          <h2>96%</h2>
          <p>Task Completion</p>
        </div>

      </div>

      <div class="progress-section">

        <div class="progress-card">
          <h3>HTML Skill</h3>

          <div class="progress-bar">
            <div class="progress html"></div>
          </div>
        </div>

        <div class="progress-card">
          <h3>CSS Skill</h3>

          <div class="progress-bar">
            <div class="progress css"></div>
          </div>
        </div>

        <div class="progress-card">
          <h3>JavaScript Skill</h3>

          <div class="progress-bar">
            <div class="progress js"></div>
          </div>
        </div>

      </div>

    </div>

  </div>

</body>
</html>
